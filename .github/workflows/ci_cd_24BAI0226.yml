name: SkillGap Radar CI/CD Pipeline - Garudaiahgari Sai Siri Chandana (24BAI0226)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Prisma Validation (24BAI0226)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: skillgap_radar_24BAI0226
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Generate Prisma Client
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/skillgap_radar_24BAI0226?schema=public"
        run: npx prisma generate

      - name: Validate Prisma Schema & Push
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/skillgap_radar_24BAI0226?schema=public"
        run: npx prisma db push --skip-generate

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build

      - name: Log Pipeline Verification
        run: |
          echo "=================================================================="
          echo " CI/CD Pipeline Succeeded for Garudaiahgari Sai Siri Chandana (24BAI0226)"
          echo " Course: BCSE302P Database Systems Lab | Slot: L25+L26"
          echo " Timestamp: $(date -u)"
          echo "=================================================================="
